<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY HOBBY</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#20232b;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}aside{position:fixed;width:235px;inset:0 auto 0 0;background:#fff;border-right:1px solid #e9e9ee;padding:30px 16px}aside h1{font-size:23px;letter-spacing:-1px;margin:0 12px 42px}.nav{display:block;width:100%;padding:13px 16px;margin:5px 0;border:0;background:transparent;text-align:left;border-radius:13px;color:#626774}.nav.active{background:#eaf0ff;color:#2563eb;font-weight:700}main{margin-left:235px;max-width:1400px;padding:45px 5vw}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h2{font-size:34px;letter-spacing:-1.5px;margin:4px 0}h3{margin:0 0 16px;font-size:19px}.muted{color:#8a909c}.btn{border:0;background:#2563eb;color:#fff;padding:11px 17px;border-radius:12px;font-weight:650}.btn.secondary{background:#e9ecf3;color:#333}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin:28px 0}.card,.panel{background:#fff;border:1px solid #eceef3;border-radius:22px;padding:24px;box-shadow:0 6px 24px #18243c08}.card .number{font-size:32px;font-weight:750;margin:10px 0 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:17px;margin-top:20px}.item{background:#fff;border:1px solid #eceef3;border-radius:20px;overflow:hidden}.cover{height:155px;display:grid;place-items:center;background:linear-gradient(135deg,#dfe8ff,#f6eaff);font-size:56px}.item-body{padding:18px}.item h3{margin:0 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{display:inline-block;background:#eff4ff;color:#3563b5;border-radius:30px;padding:5px 10px;font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.item .row{margin-top:15px}.small{font-size:13px}.empty{padding:48px 16px;text-align:center;color:#9298a5}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:25px 0 10px}.search{border:1px solid #e3e6ec;border-radius:12px;padding:12px 14px;max-width:350px;width:100%;background:#fff;color:inherit}dialog{border:0;border-radius:24px;padding:0;width:min(510px,92vw);box-shadow:0 25px 90px #0003;background:var(--modal,#fff);color:inherit}dialog::backdrop{background:#10182880}.modal{padding:28px}.modal label{display:block;margin:14px 0 5px;font-size:13px;font-weight:650}.modal input,.modal select,.modal textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #dfe3e9;background:transparent;color:inherit}.modal textarea{min-height:75px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.hidden{display:none!important}.log{padding:13px 0;border-bottom:1px solid #edf0f4}.log:last-child{border:0}.progress{height:7px;background:#edf0f5;border-radius:5px;margin-top:12px;overflow:hidden}.progress span{display:block;background:#5486f7;height:100%}body.dark{background:#11141b;color:#e9ebf0;--modal:#242935}body.dark aside,body.dark .card,body.dark .panel,body.dark .item,body.dark .search{background:#1d222c;border-color:#303744;color:#e9ebf0}body.dark .nav{color:#aeb5c4}body.dark .nav.active{background:#253856;color:#9fc2ff}body.dark .btn.secondary{background:#343b49;color:#eee}body.dark .pill{background:#293d5e;color:#b4d0ff}body.dark .cover{background:linear-gradient(135deg,#293c5e,#493755)}@media(max-width:750px){aside{inset:auto 0 0 0;width:100%;height:69px;padding:7px;display:flex;justify-content:space-around;z-index:3;border-right:0;border-top:1px solid #e6e8ee}aside h1{display:none}.nav{font-size:12px;text-align:center;padding:12px 4px;margin:0}main{margin:0;padding:24px 17px 100px}h2{font-size:28px}.cards{grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:16px}.card .number{font-size:25px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cover{height:120px}.item-body{padding:12px}.item h3{font-size:15px}.toolbar{align-items:stretch}.search{min-width:0}}
</style></head><body><aside><h1>✦ MY HOBBY</h1><button class="nav active" data-page="home">⌂ 홈</button><button class="nav" data-page="books">📚 독서</button><button class="nav" data-page="games">🎮 게임</button><button class="nav" data-page="logs">◷ 활동 기록</button><button class="nav" data-page="settings">⚙ 설정</button></aside><main id="app"></main><dialog id="editor"><form class="modal" id="editForm"><h3 id="modalTitle">등록</h3><input type="hidden" name="id"><input type="hidden" name="kind"><label>제목 *</label><input name="title" required maxlength="150"><label>저자 / 개발사</label><input name="creator" maxlength="120"><label>플랫폼 / 형식</label><input name="platform" placeholder="예: PS5, Steam, 전자책"><label>상태</label><select name="status"><option>예정</option><option>진행 중</option><option>완료</option><option>중단</option></select><label>진행률 (0~100%)</label><input name="progress" type="number" min="0" max="100" value="0"><label>개인 평점 (0~10, 선택)</label><input name="rating" type="number" min="0" max="10" step="0.5"><label>메모</label><textarea name="memo"></textarea><div class="actions"><button type="button" class="btn secondary" onclick="editor.close()">취소</button><button class="btn">저장</button></div></form></dialog><dialog id="logDialog"><form class="modal" id="logForm"><h3>활동 기록 추가</h3><label>관련 콘텐츠</label><select name="itemId" id="logItem"></select><label>날짜</label><input name="date" type="date" required><label>활동 시간 (분)</label><input name="minutes" type="number" min="0" value="30" required><label>메모</label><textarea name="note" placeholder="오늘 어떤 활동을 했나요?"></textarea><div class="actions"><button type="button" class="btn secondary" onclick="logDialog.close()">취소</button><button class="btn">저장</button></div></form></dialog><script>
const KEY='myhobby-v01';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{items:[],logs:[],dark:false}}catch{db={items:[],logs:[],dark:false}};db.items||=[];db.logs||=[];let page='home',query='';const app=document.querySelector('#app'),editor=document.querySelector('#editor'),logDialog=document.querySelector('#logDialog');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()};const uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());function nav(p){page=p;query='';render()}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>nav(b.dataset.page));function pageHeader(title,desc,action=''){return `<header><div><h2>${title}</h2><div class="muted">${desc}</div></div>${action}</header>`}function card(item){let icon=item.kind==='books'?'📖':'🎮';return `<article class="item"><div class="cover">${icon}</div><div class="item-body"><h3 title="${esc(item.title)}">${esc(item.title)}</h3><div class="muted small">${esc(item.creator||item.platform||'정보 없음')}</div><div style="margin-top:12px"><span class="pill">${esc(item.status)}</span> ${item.rating!==''&&item.rating!=null?`<span class="small">⭐ ${esc(item.rating)}</span>`:''}</div><div class="progress"><span style="width:${Number(item.progress)||0}%"></span></div><div class="row"><button class="btn secondary small" onclick="edit('${item.id}')">수정</button><button class="btn secondary small" onclick="addLog('${item.id}')">+ 기록</button></div></div></article>`}function list(kind){const title=kind==='books'?'독서 라이브러리':'게임 라이브러리';const items=db.items.filter(i=>i.kind===kind&&[i.title,i.creator,i.platform].some(v=>String(v||'').toLowerCase().includes(query.toLowerCase())));return pageHeader(title,'나만의 컬렉션을 기록하고 관리하세요.',`<button class="btn" onclick="edit(null,'${kind}')">+ 새 ${kind==='books'?'책':'게임'} 등록</button>`)+`<div class="toolbar"><input class="search" placeholder="제목, 저자, 플랫폼 검색" value="${esc(query)}" oninput="searchItems(this.value)"><span class="muted small">${items.length}개</span></div>`+(items.length?`<div class="grid">${items.map(card).join('')}</div>`:`<div class="panel empty">아직 등록된 ${kind==='books'?'책':'게임'}이 없어요.<br>상단의 등록 버튼으로 시작해보세요.</div>`)}function searchItems(s){query=s;let pos=document.activeElement.selectionStart;render();let el=document.querySelector('.search');el?.focus();el?.setSelectionRange(pos,pos)}function render(){document.body.classList.toggle('dark',!!db.dark);document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='books'||page==='games'){app.innerHTML=list(page);return}if(page==='home'){let ongoing=db.items.filter(i=>i.status==='진행 중'),mins=db.logs.reduce((a,l)=>a+(Number(l.minutes)||0),0);app.innerHTML=pageHeader('나의 취미 공간','좋아하는 것들을 기록하고, 소중한 시간을 모아보세요.',`<button class="btn" onclick="nav('books')">+ 콘텐츠 추가</button>`)+`<div class="cards"><div class="card"><div class="muted">📚 등록한 책</div><div class="number">${db.items.filter(i=>i.kind==='books').length}</div></div><div class="card"><div class="muted">🎮 등록한 게임</div><div class="number">${db.items.filter(i=>i.kind==='games').length}</div></div><div class="card"><div class="muted">⏱ 누적 활동</div><div class="number">${(mins/60).toFixed(1)}<span class="small"> 시간</span></div></div></div><section class="panel"><h3>지금 즐기는 중</h3>${ongoing.length?`<div class="grid">${ongoing.slice(0,6).map(card).join('')}</div>`:'<div class="empty">진행 중인 책이나 게임이 없어요.</div>'}</section><section class="panel" style="margin-top:20px"><h3>최근 활동</h3>${logRows(3)}</section>`;return}if(page==='logs'){app.innerHTML=pageHeader('활동 기록','취미에 쓴 시간을 차곡차곡 쌓아보세요.',`<button class="btn" onclick="addLog()">+ 활동 기록</button>`)+`<div class="panel" style="margin-top:28px">${logRows()}</div>`;return}app.innerHTML=pageHeader('설정','나에게 맞게 MY HOBBY를 관리하세요.')+`<div class="panel" style="margin-top:28px"><h3>화면 설정</h3><button class="btn secondary" onclick="db.dark=!db.dark;save()">${db.dark?'☀ 라이트 모드':'☾ 다크 모드'} 전환</button><h3 style="margin-top:35px">데이터 관리</h3><p class="muted small">현재 데이터는 이 브라우저에만 저장됩니다. 다른 기기와 자동 동기화되지 않습니다.</p><div class="row"><button class="btn" onclick="exportData()">JSON 백업 다운로드</button><label class="btn secondary" style="cursor:pointer">백업 가져오기<input type="file" accept="application/json" onchange="importData(this)" style="display:none"></label></div><p class="muted small" style="margin-top:25px">MY HOBBY v0.1 · 개인용 프로토타입</p></div>`}function logRows(n){let logs=[...db.logs].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,n||Infinity);return logs.length?logs.map(l=>{let i=db.items.find(i=>i.id===l.itemId);return `<div class="log"><strong>${esc(i?.title||'삭제된 콘텐츠')}</strong> <span class="pill">${esc(l.date)}</span><div class="muted small" style="margin-top:7px">${Number(l.minutes)}분 · ${esc(l.note||'메모 없음')} <button class="btn secondary small" style="float:right;padding:4px 9px" onclick="removeLog('${l.id}')">삭제</button></div></div>`}).join(''):'<div class="empty">기록이 아직 없어요. 오늘의 활동을 남겨보세요.</div>'}function edit(id,kind){const i=db.items.find(x=>x.id===id),f=document.querySelector('#editForm');f.reset();f.elements.id.value=i?.id||'';f.elements.kind.value=i?.kind||kind||'books';['title','creator','platform','status','progress','rating','memo'].forEach(k=>{if(i)f.elements[k].value=i[k]??''});document.querySelector('#modalTitle').textContent=i?'콘텐츠 수정':'새 콘텐츠 등록';let old=document.querySelector('#deleteItem');old?.remove();if(i){let b=document.createElement('button');b.type='button';b.id='deleteItem';b.className='btn secondary';b.textContent='삭제';b.onclick=()=>{if(confirm('이 콘텐츠와 연결된 활동 기록을 삭제할까요?')){db.items=db.items.filter(x=>x.id!==id);db.logs=db.logs.filter(x=>x.itemId!==id);editor.close();save()}};f.querySelector('.actions').prepend(b)}editor.showModal()}document.querySelector('#editForm').onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=o.id||uid();o.progress=Math.max(0,Math.min(100,Number(o.progress)||0));let idx=db.items.findIndex(i=>i.id===o.id);if(idx>=0)db.items[idx]=o;else db.items.push(o);editor.close();save()};function addLog(id){if(!db.items.length){alert('먼저 책이나 게임을 등록해주세요.');return}let f=document.querySelector('#logForm');f.reset();document.querySelector('#logItem').innerHTML=db.items.map(i=>`<option value="${i.id}">${esc(i.kind==='books'?'📚':'🎮')} ${esc(i.title)}</option>`).join('');if(id)f.elements.itemId.value=id;f.elements.date.value=new Date().toLocaleDateString('sv-SE');logDialog.showModal()}document.querySelector('#logForm').onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));db.logs.push({...o,id:uid(),minutes:Number(o.minutes)});logDialog.close();save()};function removeLog(id){if(confirm('이 기록을 삭제할까요?')){db.logs=db.logs.filter(l=>l.id!==id);save()}}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='my-hobby-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(el){try{let obj=JSON.parse(await el.files[0].text());if(!Array.isArray(obj.items)||!Array.isArray(obj.logs))throw Error('잘못된 백업 형식');if(confirm('현재 데이터를 백업 파일로 교체할까요?')){db={items:obj.items,logs:obj.logs,dark:!!obj.dark};save()}}catch(e){alert('백업을 읽을 수 없습니다: '+e.message)}el.value=''}render();
</script></body></html>
